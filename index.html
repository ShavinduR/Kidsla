<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KIDSLA — Premium 100% Cotton Kidswear (Ages 1–6) | Sri Lanka</title>
    <meta name="description" content="Soft, breathable 100% cotton essentials for little ones aged 1–6. Island-wide delivery in Sri Lanka. Order easily via WhatsApp." />
    <meta name="theme-color" content="#FAF7F2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph: WhatsApp, Facebook, Instagram, LinkedIn link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KIDSLA" />
    <meta property="og:locale" content="en_LK" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="KIDSLA — Soft on skin. Made for play." />
    <meta property="og:description" content="Premium 100% cotton kidswear for ages 1–6. Island-wide delivery · Order on WhatsApp." />
    <!-- Must be an ABSOLUTE https URL, 1200×630, under ~300 KB for WhatsApp to show it -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KIDSLA — premium 100% cotton kidswear" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KIDSLA — Soft on skin. Made for play." />
    <meta name="twitter:description" content="Premium 100% cotton kidswear for ages 1–6. Order on WhatsApp." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Meta Pixel: loaded from src/utils/analytics.js only when VITE_META_PIXEL_ID is set. -->
    <!-- Vercel Analytics: <Analytics /> in src/App.jsx — enable in Vercel → Project → Analytics. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
